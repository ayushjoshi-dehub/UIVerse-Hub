name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and Push Production Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.REGISTRY_USER }}/uiverse-hub:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Azure VM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ensure Target Directory Exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: mkdir -p ~/app

      - name: Copy docker-compose.yml to Azure VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/app"

      - name: Execute Deployment on VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            set -e

            cd ~/app

            echo "Generating environment file..."
            cat <<EOF > .env
            REGISTRY_USER=${{ secrets.REGISTRY_USER }}
            APP_URL=${{ secrets.APP_URL }}
            EOF

            chmod 600 .env

            # determine available docker compose command (docker compose v2 plugin or legacy docker-compose)
            if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
              DC_CMD="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              DC_CMD="docker-compose"
            else
              echo "No docker compose command found. Attempting to install docker-compose plugin..."
              # Try to install plugin (requires sudo) - adjust for non-Debian distros if needed
              if command -v apt-get >/dev/null 2>&1; then
                sudo apt-get update
                sudo apt-get install -y docker-compose-plugin || true
              fi

              if docker compose version >/dev/null 2>&1; then
                DC_CMD="docker compose"
              elif command -v docker-compose >/dev/null 2>&1; then
                DC_CMD="docker-compose"
              else
                echo "Failed to find or install a docker compose command. Exiting."
                exit 1
              fi
            fi

            echo "Logging in to registry..."
            echo "${{ secrets.REGISTRY_TOKEN }}" | docker login -u "${{ secrets.REGISTRY_USER }}" --password-stdin

            echo "Pulling latest docker images..."
            $DC_CMD pull

            echo "Restarting service containers..."
            $DC_CMD up -d --remove-orphans

            echo "Pruning unused docker resources..."
            docker image prune -af

            echo "Deployment completed successfully!"