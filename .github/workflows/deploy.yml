name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and Push Production Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.REGISTRY_USER }}/uiverse-hub:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Azure VM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ensure Target Directory Exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: mkdir -p ~/app

      - name: Copy docker-compose.yml to Azure VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/app"

      - name: Execute Deployment on VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            set -e

            cd ~/app

            echo "Generating environment file..."
            cat <<EOF > .env
            REGISTRY_USER=${{ secrets.REGISTRY_USER }}
            APP_URL=${{ secrets.APP_URL }}
            EOF

            chmod 600 .env

            # determine available docker compose command (docker compose v2 plugin or legacy docker-compose)
            if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
              DC_CMD="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              DC_CMD="docker-compose"
            else
              echo "No docker compose command found. Attempting to install docker-compose plugin or binary..."

              # If apt is present, add Docker's repo so docker-compose-plugin is available
              if command -v apt-get >/dev/null 2>&1; then
                sudo apt-get update
                sudo apt-get install -y ca-certificates curl gnupg lsb-release || true

                sudo mkdir -p /etc/apt/keyrings
                curl -fsSL https://download.docker.com/linux/$(. /etc/os-release && echo "$ID")/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg || true

                echo \
                  "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/$(. /etc/os-release && echo "$ID") \
                  $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null || true

                sudo apt-get update
                sudo apt-get install -y docker-compose-plugin || true
              fi

              # Re-check
              if docker compose version >/dev/null 2>&1; then
                DC_CMD="docker compose"
              elif command -v docker-compose >/dev/null 2>&1; then
                DC_CMD="docker-compose"
              else
                # Fallback: download docker compose v2 binary into CLI plugins (pick a stable release)
                COMPOSE_VER="v2.20.2"  # update as needed
                PLUGIN_DIR="/usr/local/lib/docker/cli-plugins"
                sudo mkdir -p "$PLUGIN_DIR"
                sudo curl -SL "https://github.com/docker/compose/releases/download/${COMPOSE_VER}/docker-compose-$(uname -s)-$(uname -m)" -o "$PLUGIN_DIR/docker-compose" || true
                sudo chmod +x "$PLUGIN_DIR/docker-compose" || true

                if docker compose version >/dev/null 2>&1; then
                  DC_CMD="docker compose"
                elif command -v docker-compose >/dev/null 2>&1; then
                  DC_CMD="docker-compose"
                else
                  echo "Failed to find or install a docker compose command. Exiting."
                  exit 1
                fi
              fi
            fi

            echo "Logging in to registry..."
            echo "${{ secrets.REGISTRY_TOKEN }}" | docker login -u "${{ secrets.REGISTRY_USER }}" --password-stdin

            echo "Pulling latest docker images..."
            $DC_CMD pull

            echo "Stopping and removing existing containers..."
            $DC_CMD down --remove-orphans

            echo "Restarting service containers..."
            $DC_CMD up -d --remove-orphans

            echo "Pruning unused docker resources..."
            docker image prune -af

            echo "Deployment completed successfully!"