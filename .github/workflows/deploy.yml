name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and Push Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ secrets.REGISTRY_USER }}/uiverse-hub:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Azure VM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to Azure VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/app"

      - name: Execute Deployment on VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            set -e
            
            # Ensure deployment directory exists
            mkdir -p ~/app
            cd ~/app

            # Construct .env file dynamically with application secrets and variables
            echo "Generating environment file..."
            cat <<EOF > .env
            REGISTRY_USER=${{ secrets.REGISTRY_USER }}
            APP_URL=${{ secrets.APP_URL }}
            EOF

            # Secure the .env file permissions
            chmod 600 .env

            # Log in to GitHub Container Registry on the Azure VM
            echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ghcr.io -u "${{ secrets.REGISTRY_USER }}" --password-stdin

            # Pull latest containers
            echo "Pulling latest docker images..."
            docker compose pull

            # Re-create and restart container services
            echo "Restarting service containers..."
            docker compose up -d --remove-orphans

            # Clean up old unused docker assets (idempotent cleanup)
            echo "Pruning unused docker resources..."
            docker image prune -af
            docker system prune -f --volumes

            echo "Deployment completed successfully!"