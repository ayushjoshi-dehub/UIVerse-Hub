services:
  web:
    image: ${REGISTRY_USER}/uiverse-hub:latest
    container_name: uiverse-hub-app
    ports:
      - "80:3000"
    environment:
      - NODE_ENV=production
      - APP_URL=${APP_URL}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
