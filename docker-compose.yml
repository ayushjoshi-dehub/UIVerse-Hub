version: '3.8'

services:
  web:
    image: ghcr.io/${REGISTRY_USER}/uiverse-hub:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:3000"
    environment:
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - APP_URL=${APP_URL}
    restart: always
